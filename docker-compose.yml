services:
  mysql:
    image: mysql:8.0
    container_name: lawyer-ai-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    expose:
      - "3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - lawyer-ai-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    container_name: lawyer-ai-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    expose:
      - "6379"

    volumes:
      - redis-data:/data

    networks:
      - lawyer-ai-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: lawyer-ai-ollama

    restart: unless-stopped

    expose:
      - "11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - lawyer-ai-network

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: lawyer-ai-ollama-init

    restart: "no"

    environment:
      OLLAMA_HOST: http://ollama:11434

    networks:
      - lawyer-ai-network

    depends_on:
      ollama:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >
        ollama list | grep -q "${OLLAMA_EMBEDDING_MODEL:-bge-m3}"
        || ollama pull "${OLLAMA_EMBEDDING_MODEL:-bge-m3}"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile

    image: lawyer-ai-assistant:0.0.1
    container_name: lawyer-ai-mcp-server

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: mcp-server

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}

      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}

      OLLAMA_BASE_URL: http://ollama:11434

      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}

      LEGAL_KNOWLEDGE_LOCATION: ${LEGAL_KNOWLEDGE_LOCATION:-classpath:knowledge/}

      LEGAL_KNOWLEDGE_VERSION: ${LEGAL_KNOWLEDGE_VERSION:-v1}

      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError

    expose:
      - "8081"

    networks:
      - lawyer-ai-network

    depends_on:
      ollama-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mcp-agent:
    image: lawyer-ai-assistant:0.0.1
    container_name: lawyer-ai-mcp-agent

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: mcp-agent

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}

      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}

      AI_COST_ENABLED: ${AI_COST_ENABLED:-true}
      AI_COST_CURRENCY: ${AI_COST_CURRENCY:-USD}

      DEEPSEEK_CHAT_PROMPT_PRICE_PER_MILLION: ${DEEPSEEK_CHAT_PROMPT_PRICE_PER_MILLION:-0}
      DEEPSEEK_CHAT_COMPLETION_PRICE_PER_MILLION: ${DEEPSEEK_CHAT_COMPLETION_PRICE_PER_MILLION:-0}

      LEGAL_MCP_SERVER_URL: http://mcp-server:8081

      MCP_REQUEST_TIMEOUT: ${MCP_REQUEST_TIMEOUT:-30s}

      LEGAL_KNOWLEDGE_VERSION: ${LEGAL_KNOWLEDGE_VERSION:-v1}

      AI_COST_GUARDRAIL_ENABLED: ${AI_COST_GUARDRAIL_ENABLED:-true}

      AI_COST_WARN_PER_EXECUTION_USD: ${AI_COST_WARN_PER_EXECUTION_USD:-0.02}

      AI_COST_CRITICAL_PER_EXECUTION_USD: ${AI_COST_CRITICAL_PER_EXECUTION_USD:-0.05}

      AI_COST_REQUIRE_COMPLETE_USAGE: ${AI_COST_REQUIRE_COMPLETE_USAGE:-true}

      AI_COST_REQUIRE_COMPLETE_PRICING: ${AI_COST_REQUIRE_COMPLETE_PRICING:-true}

      AI_LIVE_EVALUATION_ENABLED: ${AI_LIVE_EVALUATION_ENABLED:-false}

      AI_EVALUATION_DATASET_LOCATION: ${AI_EVALUATION_DATASET_LOCATION:-classpath:evaluation/legal-evaluation-dataset.json}

      AI_EVALUATION_MAXIMUM_CASES: ${AI_EVALUATION_MAXIMUM_CASES:-5}

      AI_EVALUATION_JUDGE_ENABLED: ${AI_EVALUATION_JUDGE_ENABLED:-false}
      AI_EVALUATION_JUDGE_MINIMUM_SCORE: ${AI_EVALUATION_JUDGE_MINIMUM_SCORE:-75}
      AI_EVALUATION_JUDGE_FAIL_OPEN: ${AI_EVALUATION_JUDGE_FAIL_OPEN:-true}
      AI_EVALUATION_JUDGE_MAXIMUM_ANSWER_CHARACTERS: ${AI_EVALUATION_JUDGE_MAXIMUM_ANSWER_CHARACTERS:-12000}

      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError

    expose:
      - "8080"

    networks:
      - lawyer-ai-network

    depends_on:
      mcp-server:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: lawyer-ai-prometheus

    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    expose:
      - "9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - lawyer-ai-network

  grafana:
    image: grafana/grafana:latest
    container_name: lawyer-ai-grafana

    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}

    expose:
      - "3000"

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - lawyer-ai-network

    depends_on:
      - prometheus

networks:
  lawyer-ai-network:
    name: lawyer-ai-network

volumes:
  mysql-data:
    name: lawyer-ai-mysql-data

  redis-data:
    name: lawyer-ai-redis-data

  ollama-data:
    name: lawyer-ai-ollama-data

  prometheus-data:
    name: lawyer-ai-prometheus-data

  grafana-data:
    name: lawyer-ai-grafana-data
