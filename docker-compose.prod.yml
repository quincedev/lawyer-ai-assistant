services:
  mcp-agent:
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: mcp-agent,prod

      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-lawyer-ai-assistant}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}

      SPRING_FLYWAY_ENABLED: "true"

      AI_CACHE_BACKEND: ${AI_CACHE_BACKEND:-REDIS}
      AI_CACHE_REDIS_KEY_PREFIX: ${AI_CACHE_REDIS_KEY_PREFIX:-lawyer-ai}
      AI_CACHE_REDIS_FAIL_OPEN: ${AI_CACHE_REDIS_FAIL_OPEN:-true}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

      mcp-server:
        condition: service_healthy

    mem_limit: 2g
    cpus: 2.0

  mcp-server:
    environment:
      SPRING_PROFILES_ACTIVE: mcp-server,prod

      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-lawyer-ai-assistant}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}

      SPRING_FLYWAY_ENABLED: "false"

      AI_CACHE_BACKEND: ${AI_CACHE_BACKEND:-REDIS}
      AI_CACHE_REDIS_KEY_PREFIX: ${AI_CACHE_REDIS_KEY_PREFIX:-lawyer-ai}
      AI_CACHE_REDIS_FAIL_OPEN: ${AI_CACHE_REDIS_FAIL_OPEN:-true}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    mem_limit: 2g
    cpus: 2.0

  mysql:
    volumes:
      - mysql-prod-data:/var/lib/mysql

    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    ports:
      - "3000:3000"
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  ollama:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mysql-prod-data:
    name: lawyer-ai-mysql-prod-data
