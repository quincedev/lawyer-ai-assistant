server:
    port: ${SERVER_PORT:8081}

spring:
    application:
        name: lawyer-ai-assistant-mcp-server

    ai:
        model:
            embedding: ollama

        mcp:
            server:
                enabled: true
                name: legal-mcp-server
                version: 1.0.0
                type: SYNC
                protocol: STATELESS

                capabilities:
                    tool: true
                    resource: false
                    prompt: false
                    completion: false

                annotation-scanner:
                    enabled: true

            # MCP Server 不同时作为 MCP Client。
            client:
                enabled: false

app:
    agent:
        # Server 内部执行 Local Legal Tool。
        legal-tool-mode: local

    mcp:
        security:
            allowed-tools:
                - searchLegalKnowledge

            arguments:
                max-string-length: 10000
                reject-unknown-fields: true

    rag:
        # location/version 继承 application.yaml，
        # 此处只声明 Server 的角色差异。
        knowledge-base:
            enabled: true
