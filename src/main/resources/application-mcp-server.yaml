server:
    port: ${SERVER_PORT:8081}

spring:
    application:
        name: lawyer-ai-assistant-mcp-server

    ai:
        mcp:
            # =======================================================
            # MCP Server Role
            # =======================================================
            server:
                enabled: true
                name: legal-mcp-server
                version: 1.0.0
                type: SYNC
                protocol: STATELESS

                capabilities:
                    tool: true
                    resource: false
                    prompt: false
                    completion: false

                annotation-scanner:
                    enabled: true

            # =======================================================
            # MCP Server 不再充当 MCP Client。
            #
            # 避免形成：
            #
            # Server
            # → MCP Client
            # → Server
            # → ...
            # =======================================================
            client:
                enabled: false

app:
    # ===========================================================
    # Legal Tool
    # ===========================================================
    agent:
        # MCP Server 内部真正执行 Local Legal Tool。
        legal-tool-mode: local

    # ===========================================================
    # MCP Server Security
    # ===========================================================
    mcp:
        security:
            # Default DENY。
            #
            # 只有白名单中的 Tool 才允许从 MCP 暴露。
            allowed-tools:
                - searchLegalKnowledge

            arguments:
                max-string-length: 10000
                reject-unknown-fields: true

    # ===========================================================
    # RAG Knowledge Base
    #
    # 只有 MCP Server 负责：
    #
    # knowledge document
    # → splitter
    # → bge-m3
    # → vector store
    # ===========================================================
    rag:
        knowledge-base:
            enabled: true
            location: ${LEGAL_KNOWLEDGE_LOCATION:classpath:knowledge/}
