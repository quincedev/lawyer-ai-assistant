server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: lawyer-ai-assistant-mcp-agent

    ai:
        # Agent 不创建任何 EmbeddingModel。
        model:
            embedding: none

        mcp:
            server:
                enabled: false

            client:
                enabled: true
                name: lawyer-agent-mcp-client
                version: 1.0.0
                type: SYNC
                initialized: true
                request-timeout: ${MCP_REQUEST_TIMEOUT:30s}

                streamable-http:
                    connections:
                        legal-server:
                            url: ${LEGAL_MCP_SERVER_URL:http://localhost:8081}
                            endpoint: /mcp

app:
    agent:
        legal-tool-mode: mcp

    rag:
        knowledge-base:
            enabled: false
