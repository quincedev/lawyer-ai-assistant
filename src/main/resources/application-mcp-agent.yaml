server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: lawyer-ai-assistant-mcp-agent

    ai:
        mcp:
            # =======================================================
            # Agent Role
            #
            # Agent 是 MCP Client。
            # 绝对不同时启动 MCP Server。
            # =======================================================
            server:
                enabled: false

            client:
                enabled: true
                name: lawyer-agent-mcp-client
                version: 1.0.0
                type: SYNC
                initialized: true
                request-timeout: ${MCP_REQUEST_TIMEOUT:30s}

                # =====================================================
                # Spring AI 2.x Streamable HTTP
                #
                # Local:
                #   http://localhost:8081/mcp
                #
                # Docker:
                #   http://mcp-server:8081/mcp
                # =====================================================
                streamable-http:
                    connections:
                        legal-server:
                            url: ${LEGAL_MCP_SERVER_URL:http://localhost:8081}
                            endpoint: /mcp

app:
    agent:
        # =========================================================
        # Agent 必须通过 MCP 调用法律知识 Tool。
        #
        # 如果缺少这一项，
        # McpLegalKnowledgeTool 不会成为实际 Legal Tool。
        # =========================================================
        legal-tool-mode: mcp

    rag:
        # =========================================================
        # Agent 不负责初始化本地法律 Knowledge Base。
        #
        # 避免：
        # Agent + Server 两边重复 Embedding / Vector 初始化。
        # =========================================================
        knowledge-base:
            enabled: false
