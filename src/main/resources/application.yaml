spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

      client-type: lettuce

  application:
    name: lawyer-ai-assistant

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/lawyer_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Step 5D 完成迁移与 Profile 集成前暂不自动执行。
    enabled: false

  ai:
    # =========================================================
    # Model
    # =========================================================
    model:
      chat: deepseek
      embedding: ollama

    # =========================================================
    # DeepSeek
    # =========================================================
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}

    # =========================================================
    # Ollama Embedding
    #
    # Local:
    #   http://localhost:11434
    #
    # Docker:
    #   http://ollama:11434
    # =========================================================
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      init:
        # Local 环境已经手动下载 bge-m3，
        # Spring Boot 启动时不主动 pull。
        pull-model-strategy: never

      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        truncate: true

    # =========================================================
    # MCP Role Isolation
    #
    # 基础配置不承担任何 MCP Role。
    #
    # mcp-agent profile:
    #   client = true
    #
    # mcp-server profile:
    #   server = true
    # =========================================================
    mcp:
      server:
        enabled: false

      client:
        enabled: false

# =============================================================
# Application Configuration
# =============================================================
app:
  evaluation:
    live:
      enabled: ${AI_LIVE_EVALUATION_ENABLED:false}
      dataset-location: ${AI_EVALUATION_DATASET_LOCATION:classpath:evaluation/legal-evaluation-dataset.json}
      maximum-cases: ${AI_EVALUATION_MAXIMUM_CASES:5}

    judge:
      enabled: ${AI_EVALUATION_JUDGE_ENABLED:false}
      minimum-score: ${AI_EVALUATION_JUDGE_MINIMUM_SCORE:75}
      fail-open: ${AI_EVALUATION_JUDGE_FAIL_OPEN:true}
      maximum-answer-characters: ${AI_EVALUATION_JUDGE_MAXIMUM_ANSWER_CHARACTERS:12000}

  observability:
    cost:
      enabled: ${AI_COST_ENABLED:true}
      currency: ${AI_COST_CURRENCY:USD}

      models:
        "[deepseek-v4-flash]":
          prompt-per-million: ${DEEPSEEK_CHAT_PROMPT_PRICE_PER_MILLION:0}
          completion-per-million: ${DEEPSEEK_CHAT_COMPLETION_PRICE_PER_MILLION:0}

  security:
    identity:
      # 默认开发模式继续使用内存账号。
      store: in-memory

  # ===========================================================
  # AI Cache
  # ===========================================================
  cache:
    enabled: true

    # 默认模式保持原有行为。
    backend: ${AI_CACHE_BACKEND:CAFFEINE}

    # Cache Key 中使用当前 Knowledge Version，
    # 知识版本升级后自然生成新 Key。
    knowledge-version: ${LEGAL_KNOWLEDGE_VERSION:v1}

    redis:
      key-prefix: ${AI_CACHE_REDIS_KEY_PREFIX:lawyer-ai}
      fail-open: ${AI_CACHE_REDIS_FAIL_OPEN:true}

    retrieval:
      enabled: true
      maximum-size: 1000
      ttl: 30m

    tool:
      enabled: true
      maximum-size: 1000
      ttl: 30m

  # ===========================================================
  # Agent
  # ===========================================================
  agent:
    # 普通 Local 启动继续使用 Local Tool。
    #
    # application-mcp-agent.yaml
    # 会覆盖为 mcp。
    legal-tool-mode: local

    # =========================================================
    # Prompt Window
    # =========================================================
    prompt-window:
      max-historical-observations: 1
      max-evidence-chars: 4000

    # =========================================================
    # Legal Evidence Compaction
    # =========================================================
    legal-evidence-compaction:
      enabled: true
      max-chars: 8000
      max-section-chars: 1800
      max-sections: 4

    # =========================================================
    # Performance Guardrail
    #
    # 注意：
    # Runtime Guardrail 和 Performance Guardrail
    # 职责不同。
    #
    # Performance Guardrail:
    #   WARN / CRITICAL
    #
    # Runtime Guardrail:
    #   真正执行时 BLOCK
    # =========================================================
    performance-guardrail:
      warn-llm-calls: 12
      critical-llm-calls: 15

      warn-total-duration-ms: 120000
      critical-total-duration-ms: 180000

      warn-llm-duration-ms: 120000
      warn-llm-ratio: 0.95

      warn-no-progress-suppressions: 1
      critical-no-progress-suppressions: 2

      warn-low-cache-hit-ratio:
        0.20

        # =====================================================
      # Execution Cost Guardrail
      #
      # 这是执行完成后的可观测性告警，
      # 不会中断正在执行的 LLM 请求。
      # =====================================================

      cost-enabled: ${AI_COST_GUARDRAIL_ENABLED:true}

      warn-execution-cost-usd: ${AI_COST_WARN_PER_EXECUTION_USD:0.02}

      critical-execution-cost-usd: ${AI_COST_CRITICAL_PER_EXECUTION_USD:0.05}

      require-complete-token-usage: ${AI_COST_REQUIRE_COMPLETE_USAGE:true}

      require-complete-pricing: ${AI_COST_REQUIRE_COMPLETE_PRICING:true}

  # ===========================================================
  # Tenant
  # ===========================================================
  tenant:
    quota:
      # 单 Tenant 最大并发 Agent Execution。
      max-concurrent-agent-executions: 3

  # ===========================================================
  # RAG
  # ===========================================================
  rag:
    splitter:
      chunk-size: 500
      min-chunk-size-chars: 200
      min-chunk-length-to-embed: 10
      max-num-chunks: 10000
      keep-separator: true

    legal-splitter:
      chunk-size: 500
      chunk-overlap: 80
      boundary-search-size: 120
      min-chunk-size: 30

    # 普通 Local 模式保持原来的行为。
    #
    # mcp-agent:
    #   false
    #
    # mcp-server:
    #   true
    knowledge-base:
      enabled: true
      location: ${LEGAL_KNOWLEDGE_LOCATION:classpath:knowledge/}
      version: ${LEGAL_KNOWLEDGE_VERSION:v1}

    retrieval:
      top-k: 5
      similarity-threshold: 0.0

# =============================================================
# Logging
# =============================================================
logging:
  level:
    com.quince.lawyeraiassistant.advisor.LoggingAdvisorV2: DEBUG
    SECURITY_AUDIT: INFO

# =============================================================
# Agent Runtime Guardrail
# =============================================================
agent:
  runtime:
    # 最大 Task Execution Cycle
    max-steps: 10

    # 最大 Tool Action 尝试次数
    max-tool-calls: 8

    # 最大 Retry 总次数
    max-retries: 3

    # 最大 Replan 次数
    max-replans: 2

    # Agent Execution 最大执行时间
    max-execution-time: 120s

    # 单次 Tool 最大执行时间
    max-tool-execution-time: 30s

    # 单个 Observation 最大字符数
    max-observation-length: 20000

    # Agent Context 最大字符数
    max-context-length: 60000

# =============================================================
# Security
# =============================================================
security:
  # ===========================================================
  # Input / Output Guardrail
  # ===========================================================
  guardrail:
    input:
      max-length: 10000

      prompt-injection:
        block-threshold: 2

    output:
      max-length: 20000

  # ===========================================================
  # JWT
  #
  # Local 开发保留 fallback，
  # 避免每次本地启动都必须额外配置环境变量。
  #
  # Production 会在 application-prod.yaml 中
  # 强制覆盖成 SECURITY_JWT_SECRET。
  # ===========================================================
  jwt:
    issuer: ${JWT_ISSUER:lawyer-ai-assistant}

    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes-long}

    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

# =============================================================
# Actuator / Micrometer
# =============================================================
management:
  health:
    redis:
      enabled: false

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

mybatis:
  mapper-locations:
    - classpath*:mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true
