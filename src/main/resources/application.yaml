spring:
  application:
    name: lawyer-ai-assistant

  ai:
    # 明确指定当前使用的模型实现
    model:
      chat: deepseek
      embedding: ollama

    # DeepSeek：负责聊天和答案生成
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash

    # Ollama：负责本地 Embedding
    ollama:
      base-url: http://localhost:11434

      init:
        # 模型已通过 ollama pull bge-m3 手动下载，
        # Spring Boot 启动时不再自动拉取
        pull-model-strategy: never

      embedding:
        model: bge-m3
        truncate: true

app:
  rag:
    splitter:
      # 每个 Chunk 的目标 Token 数量
      chunk-size: 500

      # Chunk 至少需要包含多少个字符
      min-chunk-size-chars: 200

      # 小于此长度的 Chunk 不进入后续 Embedding 流程
      min-chunk-length-to-embed: 10

      # 单个文档最多生成的 Chunk 数量
      max-num-chunks: 10000

      # 切分时是否保留标点符号
      keep-separator: true

    legal-splitter:
      # 每个 Chunk 的目标字符数
      chunk-size: 500

      # 相邻 Chunk 重叠的字符数
      chunk-overlap: 80

      # 达到目标长度后，向前寻找标点的最大范围
      boundary-search-size: 120

      # 过短的 Chunk 不保留
      min-chunk-size: 30

    knowledge-base:
      enabled: true
      location: classpath:knowledge/

    retrieval:
      top-k: 5
      similarity-threshold: 0.0

logging:
  level:
    com.quince.lawyeraiassistant.advisor.LoggingAdvisorV2: DEBUG

agent:
  runtime:
    # 单次 Agent Runtime 最多执行多少个 Action
    max-steps: 10

    # 同一个 Task 最多允许 RETRY 的次数
    max-retries-per-task: 2

    # 单次 Agent Runtime 最多允许 REPLAN 的次数
    max-replans: 2