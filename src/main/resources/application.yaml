spring:
  application:
    name: lawyer-ai-assistant

  ai:
    # =========================================================
    # Model
    # =========================================================
    model:
      chat: deepseek
      embedding: ollama

    # =========================================================
    # DeepSeek
    # =========================================================
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash

    # =========================================================
    # Ollama Embedding
    # =========================================================
    ollama:
      base-url: http://localhost:11434

      init:
        # bge-m3 已手动下载，不在启动时自动拉取
        pull-model-strategy: never

      embedding:
        model: bge-m3
        truncate: true

    # =========================================================
    # MCP
    #
    # 默认配置下：
    # Server 关闭
    # Client 关闭
    #
    # 具体由：
    # application-mcp-server.yaml
    # application-mcp-agent.yaml
    # 覆盖。
    # =========================================================
    mcp:
      server:
        enabled: false

      client:
        enabled: false

# =============================================================
# Application Configuration
# =============================================================
app:
  # ===========================================================
  # Agent Tool Mode
  #
  # 默认继续使用 Local Tool，
  # 保证普通启动以及 Day13～Day15 原有能力不受影响。
  #
  # MCP Agent Profile 会覆盖为：
  # legal-tool-mode: mcp
  # ===========================================================
  agent:
    legal-tool-mode: local

  tenant:
    quota:
      # 单个 Tenant 同时允许运行的最大 Agent Execution 数量
      max-concurrent-agent-executions: 3

  # ===========================================================
  # RAG
  # ===========================================================
  rag:
    splitter:
      # 每个 Chunk 的目标 Token 数量
      chunk-size: 500

      # Chunk 至少包含的字符数
      min-chunk-size-chars: 200

      # 小于该长度的 Chunk 不进入 Embedding
      min-chunk-length-to-embed: 10

      # 单个文档最多允许生成的 Chunk 数量
      max-num-chunks: 10000

      # 切分时是否保留分隔符
      keep-separator: true

    legal-splitter:
      # 每个法律 Chunk 的目标字符数
      chunk-size: 500

      # 相邻 Chunk 重叠字符数
      chunk-overlap: 80

      # 达到目标长度后向前寻找标点的最大范围
      boundary-search-size: 120

      # 过短 Chunk 不保留
      min-chunk-size: 30

    knowledge-base:
      enabled: true
      location: classpath:knowledge/

    retrieval:
      top-k: 5
      similarity-threshold: 0.0

# =============================================================
# Logging
# =============================================================
logging:
  level:
    com.quince.lawyeraiassistant.advisor.LoggingAdvisorV2: DEBUG
    SECURITY_AUDIT: INFO

# =============================================================
# Agent Runtime
# =============================================================
agent:
  runtime:
    # 单次 Agent Execution 最大 Task Execution Cycle 数量
    max-steps: 10

    # 单次 Agent Execution 最大 Tool Action 尝试次数
    max-tool-calls: 8

    # 单次 Agent Execution 最大 Retry 总次数
    max-retries: 3

    # 单次 Agent Execution 最大 Replan 次数
    max-replans: 2

    # 整个 Agent Execution 最大执行时间
    max-execution-time: 120s

    # 单次 Tool 最大执行时间
    max-tool-execution-time: 30s

    # 单个 Observation 最大字符数
    max-observation-length: 20000

    # Agent 上下文最大字符数
    max-context-length: 60000

security:
  guardrail:
    input:
      max-length: 10000

      prompt-injection:
        block-threshold: 2

    output:
      max-length: 20000

  jwt:
    issuer: lawyer-ai-assistant

    # 开发环境通过环境变量提供。
    # 不要把真实 Secret 提交到 Git。
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes-long}

    access-token-ttl: 1h

# =============================================================
# Actuator
# =============================================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

  endpoint:
    health:
      show-details: never
