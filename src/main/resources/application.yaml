spring:
  application:
    name: lawyer-ai-assistant

  ai:
    # =========================================================
    # Model
    # =========================================================
    model:
      chat: deepseek
      embedding: ollama

    # =========================================================
    # DeepSeek
    # =========================================================
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}

    # =========================================================
    # Ollama Embedding
    #
    # Local:
    #   http://localhost:11434
    #
    # Docker:
    #   http://ollama:11434
    # =========================================================
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      init:
        # Local 环境已经手动下载 bge-m3，
        # Spring Boot 启动时不主动 pull。
        pull-model-strategy: never

      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        truncate: true

    # =========================================================
    # MCP Role Isolation
    #
    # 基础配置不承担任何 MCP Role。
    #
    # mcp-agent profile:
    #   client = true
    #
    # mcp-server profile:
    #   server = true
    # =========================================================
    mcp:
      server:
        enabled: false

      client:
        enabled: false

# =============================================================
# Application Configuration
# =============================================================
app:
  # ===========================================================
  # AI Cache
  # ===========================================================
  cache:
    enabled: true

    # Knowledge Base 更新时修改版本，
    # 通过 Cache Key 自然淘汰旧缓存。
    knowledge-version: ${AI_CACHE_KNOWLEDGE_VERSION:v1}

    retrieval:
      enabled: true
      maximum-size: 1000
      ttl: 30m

    tool:
      enabled: true
      maximum-size: 1000
      ttl: 30m

  # ===========================================================
  # Agent
  # ===========================================================
  agent:
    # 普通 Local 启动继续使用 Local Tool。
    #
    # application-mcp-agent.yaml
    # 会覆盖为 mcp。
    legal-tool-mode: local

    # =========================================================
    # Prompt Window
    # =========================================================
    prompt-window:
      max-historical-observations: 1
      max-evidence-chars: 4000

    # =========================================================
    # Legal Evidence Compaction
    # =========================================================
    legal-evidence-compaction:
      enabled: true
      max-chars: 8000
      max-section-chars: 1800
      max-sections: 4

    # =========================================================
    # Performance Guardrail
    #
    # 注意：
    # Runtime Guardrail 和 Performance Guardrail
    # 职责不同。
    #
    # Performance Guardrail:
    #   WARN / CRITICAL
    #
    # Runtime Guardrail:
    #   真正执行时 BLOCK
    # =========================================================
    performance-guardrail:
      warn-llm-calls: 12
      critical-llm-calls: 15

      warn-total-duration-ms: 120000
      critical-total-duration-ms: 180000

      warn-llm-duration-ms: 120000
      warn-llm-ratio: 0.95

      warn-no-progress-suppressions: 1
      critical-no-progress-suppressions: 2

      warn-low-cache-hit-ratio: 0.20

  # ===========================================================
  # Tenant
  # ===========================================================
  tenant:
    quota:
      # 单 Tenant 最大并发 Agent Execution。
      max-concurrent-agent-executions: 3

  # ===========================================================
  # RAG
  # ===========================================================
  rag:
    splitter:
      chunk-size: 500
      min-chunk-size-chars: 200
      min-chunk-length-to-embed: 10
      max-num-chunks: 10000
      keep-separator: true

    legal-splitter:
      chunk-size: 500
      chunk-overlap: 80
      boundary-search-size: 120
      min-chunk-size: 30

    # 普通 Local 模式保持原来的行为。
    #
    # mcp-agent:
    #   false
    #
    # mcp-server:
    #   true
    knowledge-base:
      enabled: true
      location: ${LEGAL_KNOWLEDGE_LOCATION:classpath:knowledge/}

    retrieval:
      top-k: 5
      similarity-threshold: 0.0

# =============================================================
# Logging
# =============================================================
logging:
  level:
    com.quince.lawyeraiassistant.advisor.LoggingAdvisorV2: DEBUG
    SECURITY_AUDIT: INFO

# =============================================================
# Agent Runtime Guardrail
# =============================================================
agent:
  runtime:
    # 最大 Task Execution Cycle
    max-steps: 10

    # 最大 Tool Action 尝试次数
    max-tool-calls: 8

    # 最大 Retry 总次数
    max-retries: 3

    # 最大 Replan 次数
    max-replans: 2

    # Agent Execution 最大执行时间
    max-execution-time: 120s

    # 单次 Tool 最大执行时间
    max-tool-execution-time: 30s

    # 单个 Observation 最大字符数
    max-observation-length: 20000

    # Agent Context 最大字符数
    max-context-length: 60000

# =============================================================
# Security
# =============================================================
security:
  # ===========================================================
  # Input / Output Guardrail
  # ===========================================================
  guardrail:
    input:
      max-length: 10000

      prompt-injection:
        block-threshold: 2

    output:
      max-length: 20000

  # ===========================================================
  # JWT
  #
  # Local 开发保留 fallback，
  # 避免每次本地启动都必须额外配置环境变量。
  #
  # Production 会在 application-prod.yaml 中
  # 强制覆盖成 SECURITY_JWT_SECRET。
  # ===========================================================
  jwt:
    issuer: ${JWT_ISSUER:lawyer-ai-assistant}

    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes-long}

    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

# =============================================================
# Actuator / Micrometer
# =============================================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}
