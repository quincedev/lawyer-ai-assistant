# =============================================================
# Production Runtime Configuration
#
# 此 Profile 不决定：
#
# MCP Agent / MCP Server Role
#
# Role 必须分别由：
#
# mcp-agent
# mcp-server
#
# 决定。
# =============================================================

# =============================================================
# Graceful Shutdown
# =============================================================
server:
    shutdown: graceful

spring:
    lifecycle:
        timeout-per-shutdown-phase: 30s

# =============================================================
# Production Logging
# =============================================================
logging:
    level:
        # 生产环境禁止打印完整 Prompt / Response DEBUG 内容。
        com.quince.lawyeraiassistant.advisor.LoggingAdvisorV2: INFO

        # 安全审计继续保留。
        SECURITY_AUDIT: INFO

# =============================================================
# Production Actuator
# =============================================================
management:
    endpoints:
        web:
            exposure:
                include:
                    - health
                    - prometheus

    endpoint:
        health:
            show-details: never

            probes:
                enabled: true

# =============================================================
# Production JWT
#
# Production 不允许使用 application.yaml
# 中的开发 fallback secret。
#
# 容器必须显式提供：
#
# SECURITY_JWT_SECRET
# =============================================================
security:
    jwt:
        issuer: ${JWT_ISSUER:lawyer-ai-assistant}

        secret: ${SECURITY_JWT_SECRET}

        access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
